name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: '可选版本号（留空自动使用 1.0.<run_number>）'
        required: false
        default: ''
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'starcube.html'
      - 'mobile/**'
      - '.github/workflows/android-apk.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: 构建 StarCube 安卓离线安装包
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 配置 Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 构建单文件并运行回归测试
        run: |
          npm run build
          npm test

      - name: 确定构建版本号与签名模式
        id: meta
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION_NAME="$INPUT_VERSION"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
          else
            VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}"
          fi

          if [ "$HAS_KEYSTORE" = "true" ] && [ "$HAS_KS_PASS" = "true" ] && [ "$HAS_KEY_ALIAS" = "true" ] && [ "$HAS_KEY_PASS" = "true" ]; then
            BUILD_VARIANT="release"
          else
            BUILD_VARIANT="debug"
          fi

          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "build_variant=${BUILD_VARIANT}" >> "$GITHUB_OUTPUT"
          echo "版本号：${VERSION_NAME} (code ${GITHUB_RUN_NUMBER})，模式：${BUILD_VARIANT}"

      - name: 初始化 Capacitor Android 工程
        working-directory: mobile
        env:
          STARCUBE_VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          STARCUBE_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
        run: |
          if [ -f package-lock.json ]; then
            npm ci --no-audit --no-fund
          else
            npm install --no-audit --no-fund
          fi
          npm run prepare:web
          npx cap add android
          npm run configure:android

      - name: 解码正式签名证书（若已配置 Secrets）
        if: steps.meta.outputs.build_variant == 'release'
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/starcube-release.jks

      - name: 编译 APK
        working-directory: mobile/android
        env:
          STARCUBE_KEYSTORE_PATH: ${{ steps.meta.outputs.build_variant == 'release' && '/tmp/starcube-release.jks' || '' }}
          STARCUBE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STARCUBE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STARCUBE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ "${{ steps.meta.outputs.build_variant }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: 清理临时签名证书
        if: always()
        shell: bash
        run: rm -f /tmp/starcube-release.jks

      - name: 整理 APK 产物
        id: apk
        shell: bash
        run: |
          mkdir -p dist-apk
          VARIANT="${{ steps.meta.outputs.build_variant }}"
          VERSION="${{ steps.meta.outputs.version_name }}"
          if [ "$VARIANT" = "release" ]; then
            SRC="mobile/android/app/build/outputs/apk/release/app-release.apk"
          else
            SRC="mobile/android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          OUT="dist-apk/StarCube-${VERSION}-${VARIANT}.apk"
          cp "$SRC" "$OUT"
          ls -lh "$OUT"
          echo "apk_path=${OUT}" >> "$GITHUB_OUTPUT"
          echo "apk_name=StarCube-${VERSION}-${VARIANT}.apk" >> "$GITHUB_OUTPUT"

      - name: 上传 APK 构建产物
        uses: actions/upload-artifact@v4
        with:
          name: StarCube-android-${{ steps.meta.outputs.version_name }}-${{ steps.meta.outputs.build_variant }}
          path: ${{ steps.apk.outputs.apk_path }}
          retention-days: 30

      - name: 推送版本标签时自动发布 GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK="${{ steps.apk.outputs.apk_path }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" --clobber
          else
            gh release create "$TAG" "$APK" \
              --title "StarCube ${TAG}" \
              --notes "StarCube 离线安卓安装包（完全离线运行，内置打乱求解器、本地成绩存储、系统文件保存与深浅主题状态栏适配）。"
          fi
